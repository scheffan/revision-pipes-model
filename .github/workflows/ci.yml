name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Estilo (ruff)
        run: ruff check .

      - name: Notebook de Kaggle al día
        run: python scripts/build_kaggle_notebook.py --check

      - name: Tests (pytest)
        run: pytest
