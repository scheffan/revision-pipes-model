[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revision-pipes"
version = "0.1.0"
description = "Revisión remota de soldaduras de ductos: la IA prioriza las radiografías, el inspector decide."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.50"]
model = ["onnxruntime>=1.18"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
revision_pipes = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]  # se generan desde scripts/build_kaggle_notebook.py

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# El script contiene el código de las celdas como texto; se revisa al correr el notebook.
"scripts/build_kaggle_notebook.py" = ["E501"]
"scripts/etapa2_cells.py" = ["E501"]
"scripts/portero_cells.py" = ["E501"]
"scripts/calibracion_cells.py" = ["E501"]
"scripts/generate_web_fixtures.py" = ["E501"]
